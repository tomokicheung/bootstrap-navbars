<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Navbars</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="style.css" rel="stylesheet">
  </head>
  <body>
    <!-- Navbar 1: The Boardroom -->
    <div class="container-fluid px-0 boardroom">
      <nav class="navbar navbar-expand-lg bg-gradient">
        <div class="container">
          <ul class="nav justify-content-start">
            <li class="nav-item">
              <a class="navbar-brand" href="#"><i class="bi bi-instagram"></i></a>
            </li>
          </ul>
          <ul class="nav justify-content-center">
            <li class="nav-item">
              <img src="boardroom.png" height="40" alt="The Boardroom logo">
            </li>
          </ul>
          <ul class="nav justify-content-end">
            <li class="nav-item">
              <button class="btn btn-dark" type="button">Menu</button>
            </li>
          </ul>
        </div>
      </nav>
    </div>

    <!-- Navbar 2: Morning Brew -->
    <div class="morning-brew">
      <!-- row 1: logo centered on a light bar -->
      <nav class="navbar navbar-expand-lg bg-light">
        <div class="py-2 container">
          <div class="mx-auto navbar-nav">
            <img src="morningbrew.png" height="40" alt="Morning Brew logo">
          </div>
        </div>
      </nav>
      <!-- row 2: seven menu items, sticks to the top when scrolling -->
      <div class="navbar navbar-expand-lg bg-light sticky-top">
        <div class="container">
          <div class="mx-auto navbar-nav">
            <div class="nav-item border-1 border-top border-dark active border-3">Home</div>
            <div class="nav-item border-1 border-top border-dark">Order Online</div>
            <div class="nav-item border-1 border-top border-dark">Menus</div>
            <div class="nav-item border-1 border-top border-dark">Locations</div>
            <div class="nav-item border-1 border-top border-dark">About</div>
            <div class="nav-item border-1 border-top border-dark">Shop</div>
            <div class="nav-item border-1 border-top border-dark">Contact</div>
          </div>
        </div>
      </div>
    </div>

        <!-- Navbar 3: Buzz's -->
    <div class="container-fluid px-0 buzzs">
      <nav class="navbar navbar-expand-lg bg-gradient">
        <div class="py-3 container">
          <ul class="nav justify-content-start">
            <li class="nav-item"><h4 class="px-2">LUNCH</h4></li>
            <li class="nav-item"><h4 class="px-2">DINNER</h4></li>
            <li class="nav-item"><h4 class="px-2">DRINKS &amp; PUPU</h4></li>
          </ul>
          <ul class="nav justify-content-center">
            <li class="nav-item">
              <img src="buzzs.png" height="70" alt="Buzz's logo">
            </li>
          </ul>
          <ul class="nav justify-content-end">
            <li class="nav-item"><h4 class="px-2">ABOUT</h4></li>
            <li class="nav-item"><h4 class="px-2">LOCATION</h4></li>
            <li class="nav-item"><h4 class="px-2">SHOP <i class="bi bi-cart"></i></h4></li>
          </ul>
        </div>
      </nav>
    </div>

        <!-- Navbar 4: Aloha Beer -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light aloha">
      <div class="container">
        <a class="navbar-brand" href="#"><img src="aloha.png" width="110" alt="Aloha Beer logo"></a>
        <div class="nav justify-content-center">
          <a class="nav-link" href="#">Locations &amp; Menus</a>
          <a class="nav-link" href="#">Events</a>
          <a class="nav-link" href="#">Brewery</a>
          <a class="nav-link shop" href="#">Shop</a>
        </div>
        <div class="nav justify-content-end">
          <a class="nav-link" href="#">Account</a>
          <a class="nav-link" href="#">Search <i class="bi bi-search"></i></a>
          <a class="nav-link" href="#">Cart <i class="bi bi-cart3"></i></a>
        </div>
      </div>
    </nav>
    
  </body>
</html>
