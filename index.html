<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap Navbars</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="style.css" rel="stylesheet">
  </head>
  <body>
    <!-- Navbar 1: The Boardroom -->
    <div class="container-fluid px-0 boardroom">
      <nav class="navbar navbar-expand-lg bg-gradient">
        <div class="container">
          <ul class="nav justify-content-start">
            <li class="nav-item">
              <a class="navbar-brand" href="#"><i class="bi bi-instagram"></i></a>
            </li>
          </ul>
          <ul class="nav justify-content-center">
            <li class="nav-item">
              <img src="boardroom.png" height="40" alt="The Boardroom logo">
            </li>
          </ul>
          <ul class="nav justify-content-end">
            <li class="nav-item">
              <button class="btn btn-dark" type="button">Menu</button>
            </li>
          </ul>
        </div>
      </nav>
    </div>

    <!-- Navbar 2: Morning Brew -->
    <div class="morning-brew">
      <!-- row 1: logo centered on a light bar -->
      <nav class="navbar navbar-expand-lg bg-light">
        <div class="py-2 container">
          <div class="mx-auto navbar-nav">
            <img src="morningbrew.png" height="40" alt="Morning Brew logo">
          </div>
        </div>
      </nav>
      <!-- row 2: seven menu items, sticks to the top when scrolling -->
      <div class="navbar navbar-expand-lg bg-light sticky-top">
        <div class="container">
          <div class="mx-auto navbar-nav">
            <div class="nav-item border-1 border-top border-dark active border-3">Home</div>
            <div class="nav-item border-1 border-top border-dark">Order Online</div>
            <div class="nav-item border-1 border-top border-dark">Menus</div>
            <div class="nav-item border-1 border-top border-dark">Locations</div>
            <div class="nav-item border-1 border-top border-dark">About</div>
            <div class="nav-item border-1 border-top border-dark">Shop</div>
            <div class="nav-item border-1 border-top border-dark">Contact</div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
